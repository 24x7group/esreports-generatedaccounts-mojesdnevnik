<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Извештај генерисаних налога</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f4f4f9;
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #003366; /* Dark Blue */
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #ddd;
    }
    .btn {
      display: block;
      width: 200px;
      margin: 30px auto 0;
      padding: 10px;
      background-color: #003366;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #00509E;
    }
  </style>
</head>
<body>
  <h2 style="text-align: center; color: #333;">Извештај генерисаних налога за портал мој есДневник</h2>

  <table>
    <thead>
      <tr>
        <th>Корисничко име</th>
        <th>Лозинка</th>
      </tr>
    </thead>
    <tbody id="student-list"></tbody>
  </table>

  <!-- Button that links to a specified URL -->
  <a href="https://group247.wixstudio.com/esdnevnik/students" class="btn">Посети портал</a>

  <script>
    // Function to get a URL parameter by name
    function getParameterByName(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Function to display students in the table
    function displayStudents(data) {
      const list = document.getElementById('student-list');
      data.forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${student.student_portal_username}</td>
          <td>${student.student_portal_password}</td>
        `;
        list.appendChild(tr);
      });
    }

    try {
      // Get the data from the URL parameter
      const rawData = getParameterByName('data');
      const parsedData = JSON.parse(decodeURIComponent(rawData));

      // Check if the data is valid (array of objects)
      if (Array.isArray(parsedData)) {
        // Display students in the table
        displayStudents(parsedData);

        // Remove the 'data' parameter from the URL for a cleaner URL
        if (history.pushState) {
          const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
          window.history.pushState({ path: newUrl }, '', newUrl);
        }
      } else {
        throw new Error("Invalid data format");
      }
    } catch (err) {
      // Show error message if data is not valid
      document.body.innerHTML += `<p style="color:red; text-align:center;">Грешка приликом учитавања података: ${err.message}</p>`;
    }
  </script>
</body>
</html>
