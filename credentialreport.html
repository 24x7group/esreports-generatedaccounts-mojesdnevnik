<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Извештај генерисаних налога</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f4f4f9;
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #003366; /* Dark Blue */
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2 style="text-align: center; color: #333;">Извештај генерисаних налога за портал мој есДневник</h2>

  <table>
    <thead>
      <tr>
        <th>Корисничко име</th>
        <th>Лозинка</th>
      </tr>
    </thead>
    <tbody id="student-list"></tbody>
  </table>

  <script>
    function getParameterByName(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function displayStudents(data) {
      const list = document.getElementById('student-list');
      data.forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${student.student_portal_username}</td>
          <td>${student.student_portal_password}</td>
        `;
        list.appendChild(tr);
      });
    }

    try {
      const rawData = getParameterByName('data');
      const parsedData = JSON.parse(decodeURIComponent(rawData));
      if (Array.isArray(parsedData)) {
        displayStudents(parsedData);
      } else {
        throw new Error("Invalid data format");
      }
    } catch (err) {
      document.body.innerHTML += `<p style="color:red; text-align:center;">Error loading data: ${err.message}</p>`;
    }
  </script>
</body>
</html>
